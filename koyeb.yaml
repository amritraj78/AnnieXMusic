# Koyeb Free Plan Configuration
# Deploy AnnieXMusic on Koyeb Free Instance (512MB RAM)
name: anniexmusic
services:
  - name: anniexmusic
    type: web
    instance_type: free
    regions:
      - fra
    ports:
      - port: 8080
        path: /
    routes:
      - path: /
        port: 8080
    health_checks:
      - http:
          path: /health
          port: 8080
    docker:
      dockerfile: Dockerfile
